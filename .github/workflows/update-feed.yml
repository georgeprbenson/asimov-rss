# Save as .github/workflows/update-feed.yml in a GitHub repo containing asimov_rss.py.
# Turn on GitHub Pages (Settings → Pages → Deploy from branch → main / root);
# the feed is then at https://<username>.github.io/<repo>/feed.xml
name: Update Asimov Press feed

on:
  schedule:
    - cron: "17 13 * * *"   # daily, ~6am Pacific
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - run: python asimov_rss.py feed.xml 30
      - name: Commit if changed
        run: |
          git config user.name "feed-bot"
          git config user.email "feed-bot@users.noreply.github.com"
          git add feed.xml
          git diff --cached --quiet || git commit -m "Update feed" && git push
